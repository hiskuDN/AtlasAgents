[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_backend"

[project]
name = "atlas-agents"
version = "0.1.0"
description = "Local-first multi-agent coding system with MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Atlas Team", email = "atlas@example.com"},
]

dependencies = [
    # Core
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",

    # MCP
    "mcp>=0.1.0",
    "httpx>=0.25.0",

    # Telegram
    "python-telegram-bot>=20.0",

    # AI/LLM
    "ollama>=0.3.0",
    "openai>=1.0.0",
    "anthropic>=0.21.0",

    # Utils
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "GitPython>=3.1.0",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",

    # Logging
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
]

[project.scripts]
atlas = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "templates*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true